name: Backend Keep Alive

on:
  schedule:
    # Render's free tier sleeps after ~15 min idle. GitHub cron can run late, so ping every 5 min.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Check
        run: |
          # Optional override: set RENDER_BACKEND_URL in repo secrets. Defaults to production.
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          TARGET_URL="${TARGET_URL:-https://megha-backend-01bw.onrender.com}"
          echo "Pinging: ${TARGET_URL}/health"
          # Retry so a cold start (up to ~60s) still gets woken
          curl -fsS -m 60 --retry 3 --retry-delay 10 --retry-all-errors "${TARGET_URL}/health"
